{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Log in — Website Fixer</title>
  <link rel="stylesheet" href="{% static 'css/wf-base.css' %}">
  <link rel="stylesheet" href="{% static 'css/wf-auth.css' %}">
</head>
<body class="wf-body">

<div class="wf-auth">
  <div class="wf-card wf-auth__card">
    <a class="wf-auth__brand" href="/">
      <span class="wf-brand__mark">WF</span>
      <span>Website Fixer</span>
    </a>

    <h1 class="wf-auth__title">Resume your run</h1>
    <p class="wf-auth__sub">Sign in with your own name. Your race and your one official
       attempt follow you, not the machine.</p>

    {% if error %}
      <div class="wf-error" role="alert">{{ error }}</div>
    {% endif %}

    <form method="post" action="/login/" novalidate>
      {% csrf_token %}

      <div class="wf-field">
        <label for="username">Your name</label>
        <input id="username" name="username" type="text" class="wf-input" required
               autocomplete="username" placeholder="The name you registered with" autofocus />
      </div>

      <div class="wf-field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" class="wf-input" required
               autocomplete="current-password" placeholder="••••••••" />
      </div>

      <button type="submit" class="wf-btn wf-btn--primary wf-btn--block">Log in</button>
    </form>

    <div class="wf-auth__foot">
      No account yet? <a href="/signup/">Register as a participant</a><br>
      <a href="/">← Back to home</a>
    </div>
  </div>
</div>

</body>
</html>
