# Render blueprint. WebSockets need an ASGI server, so the web process is
# Daphne rather than Gunicorn.
services:
  - type: web
    name: website-fixer
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "daphne -b 0.0.0.0 -p $PORT games.asgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      # Optional: attach a Postgres instance and paste its URL here.
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: website-fixer-db
      #     property: connectionString
      # Optional: only needed when running more than one instance.
      # - key: REDIS_URL
      #   fromService:
      #     type: redis
      #     name: website-fixer-redis
      #     property: connectionString
